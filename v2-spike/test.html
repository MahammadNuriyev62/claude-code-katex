// Selects `node` and dispatches a synthetic copy through the document, which
// runs the real copy-tex handler. Returns what would land on the clipboard.
// (Trusted-path Ctrl+C is exercised on top of this by docker/run-harness.js.)
const syntheticCopy = node => {
  const sel = window.getSelection();
  sel.removeAllRanges();
  const range = document.createRange();
  range.selectNodeContents(node);
  sel.addRange(range);
  const dt = new DataTransfer();
  const evt = new ClipboardEvent('copy', { clipboardData: dt, bubbles: true, cancelable: true });
  document.dispatchEvent(evt);
  sel.removeAllRanges();
  return { text: dt.getData('text/plain'), prevented: evt.defaultPrevented };
};

            return [kx(el) >= 1 && err(el) === 0 && !!anchor && !visible.includes('label') && !visible.includes('constant-spectrum'),
                    kx(el) + ' katex, ' + err(el) + ' err, anchor=' + !!anchor + ', visible=' + JSON.stringify(visible.slice(0, 60))]; }],

  ['XREF 65 — \\label with no space before it ($$y=Hx.\\label{...}$$)', R`$$y = Hx.\label{eq:conv-theorem} \tag{5}$$`,
    el => [kx(el) >= 1 && err(el) === 0 && !!el.querySelector('#eq\\:conv-theorem'),
           kx(el) + ' katex, ' + err(el) + ' err, anchor=' + !!el.querySelector('#eq\\:conv-theorem')]],

  ['XREF 66 — \\eqref renders as a readable textual reference', R`From $\eqref{eq:zero-dc}$ it follows.`,
    el => { const t = (el.querySelector('.katex-html') || el).textContent;
            return [kx(el) === 1 && err(el) === 0 && t.includes('(eq:zero-dc)'),
                    kx(el) + ' katex, ' + err(el) + ' err, text=' + JSON.stringify(t)]; }],

  ['XREF 67 — \\ref renders as the label name', R`See $\ref{eq:dc-output}$ above.`,
    el => { const t = (el.querySelector('.katex-html') || el).textContent;
            return [kx(el) === 1 && err(el) === 0 && t.includes('eq:dc-output'),
                    kx(el) + ' katex, ' + err(el) + ' err, text=' + JSON.stringify(t)]; }],

  ['XREF 68 — copy of a labeled formula still yields the verbatim source incl. \\label', R`$$\widehat{h}(0,0) = 0. \label{eq:zero-dc}$$`,
    el => { const c = syntheticCopy(el);
            return [c.prevented && c.text.includes(R`\label{eq:zero-dc}`) && c.text.includes(R`\widehat{h}`),
                    'prevented=' + c.prevented + ' text=' + JSON.stringify(c.text)]; }],

  ['XREF 69 — the issue-#14 use case: \\eqref resolves to the \\tag number, in prose AND math', R`$$\widehat{y}(0,0) = \widehat{h}(0,0)\widehat{x}(0,0). \tag{6} \label{eq:dc-out}$$

$$\widehat{h}(0,0) = 0. \tag{7} \label{eq:zdc}$$

Combining \eqref{eq:dc-out} with $\eqref{eq:zdc}$ gives the result.`,
    el => { const t = el.textContent;
            return [el.querySelectorAll('.katex-display').length === 2 && err(el) === 0 &&
                    t.includes('Combining (6) with') && t.includes('(7)'),
                    err(el) + ' err, text=' + JSON.stringify((t.match(/Combining[^.]*\./) || ['?'])[0])]; }],

  ['XREF 70 — \\ref resolves to the bare \\tag number', R`$$z = 1 \tag{12} \label{eq:twelve}$$

As equation \ref{eq:twelve} shows.`,
    el => [err(el) === 0 && el.textContent.includes('As equation 12 shows'),
           err(el) + ' err, text=' + JSON.stringify((el.textContent.match(/As equation[^.]*\./) || ['?'])[0])]],

  ['XREF 71 — a reference in a LATER render resolves via the window registry (cross-message)', R`Recall \eqref{eq:dc-out} from before.`,
    el => [el.textContent.includes('Recall (6) from before'),
           'text=' + JSON.stringify(el.textContent.trim())]],

  ['XREF 72 — a forward reference resolves (map is built from the whole document)', R`We will show \eqref{eq:fwd} below.

$$a^2 + b^2 = c^2 \tag{9} \label{eq:fwd}$$`,
    el => [err(el) === 0 && el.textContent.includes('We will show (9) below'),
           err(el) + ' err, text=' + JSON.stringify((el.textContent.match(/We will[^.]*\./) || ['?'])[0])]],
];

const out = document.getElementById('out');
for (const [name, md] of cases) {
  const wrap = document.createElement('div');
  wrap.className = 'case';
  wrap.innerHTML = '<div class="label">' + name + '</div>';
  const r = document.createElement('div'); r.className = 'render';
  wrap.appendChild(r);
  out.appendChild(wrap);
  createRoot(r).render(React.createElement(Markdown, { remarkPlugins, rehypePlugins }, md));
}

setTimeout(() => {
  const wraps = out.querySelectorAll('.case');
  const results = [];
  cases.forEach(([name, md, pred], i) => {
    const wrap = wraps[i], r = wrap.querySelector('.render');
    let ok = false, detail = '';
    try { [ok, detail] = pred(r); } catch (e) { detail = 'threw: ' + e.message; }
    wrap.classList.add(ok ? 'pass' : 'fail');
    wrap.querySelector('.label').textContent = (ok ? 'PASS  ' : 'FAIL  ') + name + '  —  ' + detail;
    results.push({ name, ok, detail });
  });
  const passed = results.filter(r => r.ok).length;
  const s = document.getElementById('summary');
  s.textContent = passed + ' / ' + results.length + ' passed';
  s.style.color = passed === results.length ? '#4caf50' : '#f44336';
  window.__RESULTS = results;
  window.__DONE = true;
}, 1800);
</script>
