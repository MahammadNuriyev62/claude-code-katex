import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?bundle&deps=react@18.3.1';
import Markdown from 'https://esm.sh/react-markdown@9.0.1?bundle&deps=react@18.3.1';

const MD = `Inline: $x^2 + y^2 = z^2$ and $E = mc^2$.

$$\\int_0^\\infty e^{-x^2}\\,dx = \\frac{\\sqrt{\\pi}}{2}$$

const root = createRoot(document.getElementById('out'));
root.render(React.createElement(Markdown, {
  remarkPlugins: [window.__remarkMath],
  rehypePlugins: [window.__rehypeKatex],
